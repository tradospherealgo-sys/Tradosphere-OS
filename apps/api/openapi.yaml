  /v1/portfolio/snapshot:
    post:
      operationId: portfolioCreateSnapshot
      summary: Write a point-in-time MTM snapshot (Equity Curve / Portfolio History source row)
      description: |-
        Refused outright with 409 if any open position has no live price --
        a permanent history row is never written with a silently incomplete
        equity figure (Forge charter rule 2, Decision D17). Every numeric
        field is server-computed from journal_entries/market_ticks; the
        body may only supply a label and/or the as-of timestamp, which
        defaults to "now" when omitted. A request with no body at all is
        valid and treated the same as an empty object.
      tags: [Portfolio]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSnapshotInput'
      responses:
        '201':
          description: Snapshot written.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioSnapshot'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: One or more open positions have no live price -- snapshot refused, nothing written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  missingPriceSymbols:
                    type: array
                    items:
                      type: string
                required: [error, missingPriceSymbols]

  /v1/portfolio/history:
    get:
      operationId: portfolioGetHistory
      summary: Snapshot history (Equity Curve / Portfolio History)
      description: Serves both the "Equity Curve" and "Portfolio History" SPRINT_BOOK.md deliverables from one mechanism (Decision D17) -- the persisted rows written by POST /v1/portfolio/snapshot.
      tags: [Portfolio]
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive lower bound on asOf. Omitted means no floor.
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: Inclusive upper bound on asOf. Omitted means no ceiling.
      responses:
        '200':
          description: Snapshots for the caller within the requested range.
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/PortfolioSnapshot'
                required: [history]
        '400':
          description: Validation failed (from/to not a valid ISO 8601 timestamp).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
