          format: date-time
      required: [id, userId, contentType, contentId, status, progressPct, lastAccessedAt, createdAt]

    AttachTagInput:
      type: object
      properties:
        tagId:
          type: string
          format: uuid
      required: [tagId]

    UpsertProgressInput:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/EducationProgressStatus'
        progressPct:
          type: integer
          minimum: 0
          maximum: 100
      required: [status]

    TutorExplainInput:
      type: object
      properties:
        opinions:
          type: array
          items:
            $ref: '#/components/schemas/ExpertOpinion'
      required: [opinions]

    AnnotateTradeIdeaInput:
      type: object
      properties:
        tradeIdea:
          $ref: '#/components/schemas/TradeIdea'
        opinions:
          type: array
          items:
            $ref: '#/components/schemas/ExpertOpinion'
      required: [tradeIdea, opinions]

    PositionDirection:
      type: string
      enum: [long, short]

    Position:
      type: object
      description: Net position for one symbol, computed from open trade records only as a quantity-weighted average entry price (Decision D17).
      properties:
        symbol:
          type: string
        direction:
          $ref: '#/components/schemas/PositionDirection'
        quantity:
          type: number
        averageEntryPrice:
          type: number
      required: [symbol, direction, quantity, averageEntryPrice]

    PortfolioSnapshot:
      type: object
      description: One persisted row from POST /v1/portfolio/snapshot. totalEquity = startingCash + realizedPnl + unrealizedPnl, which is algebraically identical to cashBalance + positionsValue (Decision D17).
      properties:
        id:
          type: string
        userId:
          type: string
        cashBalance:
          type: number
        positionsValue:
          type: number
        realizedPnl:
          type: number
        unrealizedPnl:
          type: number
        totalEquity:
          type: number
        label:
          type: string
        asOf:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, cashBalance, positionsValue, realizedPnl, unrealizedPnl, totalEquity, asOf, createdAt]

    CreateSnapshotInput:
      type: object
      description: Every field is optional. Deliberately excludes every computed figure (cashBalance, positionsValue, realizedPnl, unrealizedPnl, totalEquity) -- a snapshot can never be fabricated or tampered with (Forge charter rule 2).
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        asOf:
          type: string
          format: date-time
          description: Defaults to the current time when omitted.

    PerformanceMetrics:
      type: object
      description: Portfolio-level performance totals only (Decision D17) -- see GET /v1/portfolio/performance's description for what's deliberately out of scope.
      properties:
        startingCash:
          type: number
        totalEquity:
          type: number
        totalReturn:
          type: number
        totalReturnPct:
          type: number
        realizedPnl:
          type: number
        unrealizedPnl:
          type: number
      required: [startingCash, totalEquity, totalReturn, totalReturnPct, realizedPnl, unrealizedPnl]

    AllocationEntry:
      type: object
      properties:
        symbol:
          type: string
        direction:
          $ref: '#/components/schemas/PositionDirection'
        marketValue:
          type: number
        allocationPct:
          type: number
      required: [symbol, direction, marketValue, allocationPct]

    RiskAdjustedReturns:
      type: object
      description: Sharpe and Sortino ratios derived from the portfolio's own equity-curve period returns (Decision D18) -- both null whenever insufficientData is true, and individually null whenever their own deviation is exactly zero.
      properties:
        sharpeRatio:
          type: number
        sortinoRatio:
          type: number
        insufficientData:
          type: boolean
      required: [insufficientData]

    SessionWindowKey:
      type: string
      description: One of four fixed, equal-width UTC-hour windows (Decision D18) -- not a specific exchange's local trading-session schedule.
      enum:
        - h00_06
        - h06_12
        - h12_18
        - h18_24

    DayOfWeek:
      type: string
      enum:
        - sunday
        - monday
        - tuesday
        - wednesday
        - thursday
        - friday
        - saturday

    MonthBucket:
      type: object
      description: UTC calendar month, keyed off the trade's own filledAtIso timestamp.
      properties:
        key:
          type: string
          description: "Sortable, human-readable month key, e.g. '2026-01'."
        year:
          type: integer
        month:
          type: integer
          description: 1-12.
      required: [key, year, month]

    MonthlyReport:
      type: object
      description: One report per UTC calendar month a trade was filled in -- a trade is attributed entirely to the month it opened, never split across months.
      properties:
        month:
          $ref: '#/components/schemas/MonthBucket'
        totalTrades:
          type: integer
        winningTrades:
          type: integer
        losingTrades:
          type: integer
        breakevenTrades:
          type: integer
        openTrades:
          type: integer
        totalRealizedPnl:
          type: number
        winRate:
          type: number
        averageReturn:
          type: number
        averageReturnPct:
          type: number
        expectancy:
          type: number
        plannedRiskRewardRatio:
          type: number
        realizedRiskRewardRatio:
          type: number
      required: [month, totalTrades, winningTrades, losingTrades, breakevenTrades, openTrades, totalRealizedPnl]

    StrategyKey:
      type: object
      description: "Groups trades by cioVerdictLabel + recommendedDirection, the only real categorical proxy available -- journal_entries has no dedicated strategy column. Entries with neither field populated fall into the explicit 'no_recommendation' bucket."
      properties:
        key:
          type: string
          description: "e.g. 'bullish__long', or 'no_recommendation'."
        cioVerdictLabel:
          type: string
        recommendedDirection:
          type: string
      required: [key]

    StrategyStats:
      type: object
      properties:
        strategy:
          $ref: '#/components/schemas/StrategyKey'
        totalTrades:
          type: integer
        winningTrades:
          type: integer
        losingTrades:
          type: integer
        breakevenTrades:
          type: integer
        openTrades:
          type: integer
        totalRealizedPnl:
          type: number
        winRate:
          type: number
        averageReturn:
          type: number
        expectancy:
          type: number
      required: [strategy, totalTrades, winningTrades, losingTrades, breakevenTrades, openTrades, totalRealizedPnl]

    DistributionBucket:
      type: object
      properties:
        rangeStart:
          type: number
        rangeEnd:
          type: number
        count:
          type: integer
      required: [rangeStart, rangeEnd, count]

    TradeDistribution:
      type: object
      description: Bucket boundaries are computed from the caller's own real min/max realized P&L, split into bucketCount (default 10, overridable via ?buckets=N) equal-width buckets -- never a fixed hardcoded currency threshold.
      properties:
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/DistributionBucket'
        minPnl:
          type: number
        maxPnl:
          type: number
      required: [buckets]

    HeatmapCell:
      type: object
      description: "Day-of-week (UTC) x session-window cell. Always 7x4=28 cells, even when a cell has zero trades -- a quiet day/session is a real fact, not an omission."
      properties:
        dayOfWeek:
          $ref: '#/components/schemas/DayOfWeek'
        session:
          $ref: '#/components/schemas/SessionWindowKey'
        sessionLabel:
          type: string
        totalTrades:
          type: integer
        totalRealizedPnl:
          type: number
        winRate:
          type: number
      required: [dayOfWeek, session, sessionLabel, totalTrades, totalRealizedPnl]

    SessionStats:
      type: object
      description: Always exactly 4 rows, one per fixed UTC-hour session window, even when a window has zero trades.
      properties:
        session:
          $ref: '#/components/schemas/SessionWindowKey'
        label:
          type: string
        totalTrades:
          type: integer
        winningTrades:
          type: integer
        losingTrades:
          type: integer
        breakevenTrades:
          type: integer
        openTrades:
          type: integer
        totalRealizedPnl:
          type: number
        winRate:
          type: number
        averageReturn:
          type: number
      required: [session, label, totalTrades, winningTrades, losingTrades, breakevenTrades, openTrades, totalRealizedPnl]

    InstrumentStats:
      type: object
      description: Grouped by the trade's own symbol -- the one unambiguous instrument field journal_entries has.
      properties:
        symbol:
          type: string
        totalTrades:
          type: integer
        winningTrades:
          type: integer
        losingTrades:
          type: integer
        breakevenTrades:
          type: integer
        openTrades:
          type: integer
        totalRealizedPnl:
          type: number
        winRate:
          type: number
        averageReturn:
          type: number
      required: [symbol, totalTrades, winningTrades, losingTrades, breakevenTrades, openTrades, totalRealizedPnl]

    FullStatSet:
      type: object
      description: The complete stat set GET /v1/analytics/performance returns, and the same set POST /v1/analytics/reports persists -- one function computes both, so they can never disagree.
      properties:
        totalTrades:
          type: integer
        winningTrades:
          type: integer
        losingTrades:
          type: integer
        breakevenTrades:
          type: integer
        openTrades:
          type: integer
        totalRealizedPnl:
          type: number
        winRate:
          type: number
        averageReturn:
          type: number
        averageReturnPct:
          type: number
        expectancy:
          type: number
        plannedRiskRewardRatio:
          type: number
        realizedRiskRewardRatio:
          type: number
        maxDrawdownPct:
          type: number
        sharpeRatio:
          type: number
        sortinoRatio:
          type: number
      required: [totalTrades, winningTrades, losingTrades, breakevenTrades, openTrades, totalRealizedPnl]

    AnalyticsReport:
      type: object
      description: The one persisted resource this service owns -- a point-in-time snapshot of the full stat set as of a given moment or over a given period.
      properties:
        id:
          type: string
        userId:
          type: string
        label:
          type: string
        fromDate:
          type: string
          format: date-time
        toDate:
          type: string
          format: date-time
        totalTrades:
          type: integer
        winningTrades:
          type: integer
        losingTrades:
          type: integer
        breakevenTrades:
          type: integer
        openTrades:
          type: integer
        totalRealizedPnl:
          type: number
        winRate:
          type: number
        averageReturn:
          type: number
        averageReturnPct:
          type: number
        expectancy:
          type: number
        plannedRiskRewardRatio:
          type: number
        realizedRiskRewardRatio:
          type: number
        maxDrawdownPct:
          type: number
        sharpeRatio:
          type: number
        sortinoRatio:
          type: number
        asOf:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
      required: [id, totalTrades, winningTrades, losingTrades, breakevenTrades, openTrades, totalRealizedPnl, asOf, createdAt]

    CreateAnalyticsReportInput:
      type: object
      description: Every field is optional and none of them are stat columns -- every number in the persisted report is server-computed from computeFullStatSet(), never caller-supplied.
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        asOf:
          type: string
          format: date-time

    AnalyzeTechnicalInput:
      type: object
      description: services/research/src/technical.ts analyzeTechnical(symbol, bars).
      properties:
        symbol:
          type: string
        bars:
          type: array
          items:
            $ref: '#/components/schemas/PriceBar'
      required: [symbol, bars]

    AnalyzeSectorInput:
      type: object
      description: services/research/src/sector.ts analyzeSector(sector, sectorBars, benchmarkBars, rotationThresholdPct?). rotationThresholdPct defaults to 2 when omitted.
      properties:
        sector:
          type: string
        sectorBars:
          type: array
          items:
            $ref: '#/components/schemas/PriceBar'
        benchmarkBars:
          type: array
          items:
            $ref: '#/components/schemas/PriceBar'
        rotationThresholdPct:
          type: number
      required: [sector, sectorBars, benchmarkBars]

    AnalyzeQuantInput:
      type: object
      description: services/research/src/quant.ts analyzeQuant(symbol, bars, period?). period defaults to 20 when omitted.
      properties:
        symbol:
          type: string
        bars:
          type: array
          items:
            $ref: '#/components/schemas/PriceBar'
        period:
          type: number
      required: [symbol, bars]

    StrategyAgentInput:
      type: object
      description: services/ai/src/agents/strategy-agent.ts. Same shape as EducationAgentInput -- both are synthesis agents that take the other experts' opinions.
      properties:
        opinions:
          type: array
          items:
            $ref: '#/components/schemas/ExpertOpinion'
      required: [opinions]

    RiskAgentInput:
      type: object
      description: services/ai/src/agents/risk-agent.ts. volatilityAnnualizedPct is optional -- omitted volatility is treated as 0 (low risk) rather than rejected.
      properties:
        opinions:
          type: array
          items:
            $ref: '#/components/schemas/ExpertOpinion'
        volatilityAnnualizedPct:
          type: number
      required: [opinions]

    EducationAgentInput:
      type: object
      description: services/ai/src/agents/education-agent.ts.
      properties:
        opinions:
          type: array
          items:
            $ref: '#/components/schemas/ExpertOpinion'
      required: [opinions]

    BuildCioVerdictInput:
      type: object
      description: services/cio/src/cio.ts buildCioVerdict(input). dataValid must be derived from real upstream state (e.g. false if any research/agent input was a ResearchGap) -- never hardcoded true.
      properties:
        symbol:
          type: string
        opinions:
          type: array
          items:
            $ref: '#/components/schemas/ExpertOpinion'
        referencePrice:
          type: number
        portfolio:
          $ref: '#/components/schemas/PortfolioRiskContext'
        dataValid:
          type: boolean
        minConfidence:
          type: number
          description: Defaults to 40 (DEFAULT_MIN_CONFIDENCE) when omitted.
        minRiskRewardRatio:
          type: number
          description: Defaults to 1.5 (DEFAULT_MIN_RISK_REWARD_RATIO) when omitted.
        stopLossPct:
          type: number
        targetRiskRewardRatio:
          type: number
      required: [symbol, opinions, referencePrice, portfolio, dataValid]

    RiskGateMitigation:
      type: object
      description: Present only when the risk gate returns Level 2.
      properties:
        positionSizeMultiplier:
          type: number
          description: "e.g. 0.5 = half the normal position size."
        leverageMultiplier:
          type: number
        note:
          type: string
      required: [positionSizeMultiplier, leverageMultiplier, note]

    RiskGateResult:
      type: object
      description: |-
        Decision D8's three-level tiered veto (services/cio/src/risk-gate.ts).
        Level 1 = hard veto, approved is false, the CIO must never override
        it. Level 2 = approved, but only alongside mitigation. Level 3 = full
        approval, no conditions triggered.
      properties:
        level:
          type: integer
          enum: [1, 2, 3]
        approved:
          type: boolean
        reasons:
          type: array
          items:
            type: string
        mitigation:
          $ref: '#/components/schemas/RiskGateMitigation'
      required: [level, approved, reasons]

    TraceEntry:
      type: object
      description: One entry per raw opinion, in input order -- every agent that spoke, whether or not it was weighted into the directional score.
      properties:
        expert:
          $ref: '#/components/schemas/ExpertName'
        verdict:
          $ref: '#/components/schemas/Verdict'
        confidence:
          type: number
        weight:
          type: number
        included:
          type: boolean
          description: True iff this opinion carried nonzero weight into the consensus score.
        contribution:
          type: number
          description: 0 when excluded.
        reasoning:
          type: array
          items:
            type: string
      required: [expert, verdict, confidence, weight, included, contribution, reasoning]

    ExplainabilityTrace:
      type: object
      description: Task 6.3. The recorded entries/consensus alone are sufficient to independently recompute the same verdict computeConsensus() produced, without re-calling it or looking at the original opinions array.
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/TraceEntry'
        consensus:
          type: object
          properties:
            weightedScore:
              type: number
            verdict:
              $ref: '#/components/schemas/Verdict'
            confidence:
              type: number
          required: [weightedScore, verdict, confidence]
        riskGate:
          $ref: '#/components/schemas/RiskGateResult'
        summary:
          type: array
          items:
            type: string
      required: [entries, consensus, summary]

    CioVerdictWithTrace:
      allOf:
        - $ref: '#/components/schemas/CioVerdict'
        - type: object
          description: "Decision D10: a superset of CioVerdict, not a modification of it -- every field CioVerdict has is present here unchanged, plus the trace/riskGate detail behind it."
          properties:
            trace:
              $ref: '#/components/schemas/ExplainabilityTrace'
            riskGate:
              $ref: '#/components/schemas/RiskGateResult'
          required: [trace, riskGate]

    # SCHEMAS_INSERTION_POINT
