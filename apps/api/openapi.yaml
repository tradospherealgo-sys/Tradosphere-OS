  # PATHS_INSERTION_POINT

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |-
        Every proxied service verifies this itself against its own JWT
        secret; the gateway's own requireAuth (used only by the 10
        in-process routes) uses the identical verifyAccessToken /
        InvalidTokenError contract from @tradosphere/auth as every other
        service.

  schemas:
    ErrorResponse:
      type: object
      description: |-
        The generic shape every service's setErrorHandler falls back to for
        unexpected errors, and the shape most caught domain errors use
        (sometimes with extra fields alongside error, e.g. 409 responses
        that also carry missingPriceSymbols). Not a Fastify-default
        {statusCode,error,message} envelope -- just {error, ...}.
      properties:
        error:
          type: string
      required: [error]

    ValidationFailure:
      type: object
      description: The zod-failure shape validateBody() returns on every 400, identical across every service (reused verbatim from services/education's original).
      properties:
        error:
          type: string
          example: Validation failed
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required: [path, message]
      required: [error, details]

    MarketTick:
      type: object
      properties:
        symbol:
          type: string
        price:
          type: number
        volume:
          type: number
        timestampIso:
          type: string
          format: date-time
      required: [symbol, price, volume, timestampIso]

    ExpertName:
      type: string
      enum: [technical, options, sector, quant, strategy, risk, fundamental, indices, education]

    Verdict:
      type: string
      enum: [bullish, moderately_bullish, neutral, moderately_bearish, bearish]

    ExpertOpinion:
      type: object
      properties:
        expert:
          $ref: '#/components/schemas/ExpertName'
        verdict:
