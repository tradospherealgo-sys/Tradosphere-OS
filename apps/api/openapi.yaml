openapi: 3.0.3
info:
  title: Tradosphere OS Gateway API
  version: "1.0.0"
  description: |-
    Unified API gateway for Tradosphere OS (Sprint 9, task 9.4). Implements
    the architecture decided in full in Decision D19 (EXECUTION_BOOK.md)
    before any gateway code was written.

    Two route families exist side by side:

    - Proxied (Auth, Market Data, Education, Portfolio, Analytics): the
      gateway reverse-proxies to each service's existing HTTP API via a
      hand-rolled wildcard handler that forwards the Authorization header
      verbatim. Each upstream service remains the sole auth authority for
      its own routes -- the gateway does NOT re-authenticate proxied
      requests.
    - In-process (Research, AI Council, CIO, Paper Trading, Journal): these
      five services are library-only with no HTTP surface of their own, so
      their routes are implemented directly on the gateway and authenticated
      by the gateway's own requireAuth (identical factory pattern to every
      other service in this repo).

    All domain routes are versioned under /v1/<service>/.... Infra routes
    (/health, /health/services, /metrics, /stream, /documentation,
    /openapi.yaml) are unversioned and, along with auth's own signup/login,
    are the only unauthenticated routes in the gateway.
servers:
  - url: http://localhost:4000
    description: Local gateway (apps/api)

tags:
  - name: Infra
    description: Health, metrics, and documentation. Unversioned, unauthenticated.
  - name: Auth
    description: |-
      Proxied verbatim to services/auth. The gateway forwards the
      Authorization header as-is and does not re-authenticate these routes.
  - name: Market Data
    description: Proxied verbatim to services/market-data. Not re-authenticated at the gateway.
  - name: Education
    description: Proxied verbatim to services/education. Not re-authenticated at the gateway.
  - name: Portfolio
    description: Proxied verbatim to services/portfolio. Not re-authenticated at the gateway.
  - name: Analytics
    description: Proxied verbatim to services/analytics. Not re-authenticated at the gateway.
  - name: Research
    description: |-
      In-process on the gateway (services/research has no HTTP surface of
      its own). Authenticated by the gateway's own requireAuth. Callers
      supply bars/option-chain data directly in the request body -- no
      tick-to-bar aggregation pipeline exists yet (Decision D19 sub-part 7).
  - name: AI Council
    description: |-
      In-process on the gateway (services/ai has no HTTP surface of its
      own). One route per expert agent -- there is no single "run the
      council" endpoint. Callers sequence the agent calls they want and
      assemble the resulting ExpertOpinion[] themselves before calling CIO.
  - name: CIO
    description: |-
      In-process on the gateway (services/cio has no HTTP surface of its
      own). Computes the consensus verdict from caller-supplied opinions
      and trade-idea candidates, and publishes every computed verdict onto
      CIO_VERDICTS_CHANNEL for /stream subscribers.
  - name: Paper Trading
    description: In-process on the gateway (services/paper-trading has no HTTP surface of its own).
  - name: Journal
    description: In-process on the gateway (services/journal has no HTTP surface of its own).

security:
  - bearerAuth: []

paths:
  /health:
    get:
      operationId: getHealth
      summary: Gateway liveness check
      tags: [Infra]
      security: []
      responses:
        '200':
          description: Gateway process is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /health/services:
    get:
      operationId: getHealthServices
      summary: Upstream service health fan-out
      description: |-
        Gateway pings each of the five proxied services' own /health
        endpoint and reports per-service reachability. Does not check the
        five in-process domains (research/ai/cio/paper-trading/journal)
        since they have no separate process to be unreachable from.
      tags: [Infra]
      security: []
      responses:
        '200':
          description: Per-service reachability report.
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: string
                    enum: [ok, unreachable]
                  marketData:
                    type: string
                    enum: [ok, unreachable]
                  education:
                    type: string
                    enum: [ok, unreachable]
                  portfolio:
                    type: string
                    enum: [ok, unreachable]
                  analytics:
                    type: string
                    enum: [ok, unreachable]

  /metrics:
    get:
      operationId: getMetrics
      summary: Prometheus metrics
      description: |-
        prom-client default Node process metrics plus a custom
        http_requests_total Counter and http_request_duration_seconds
        Histogram, recorded via an onResponse hook (Decision D19 sub-part 10).
      tags: [Infra]
      security: []
      responses:
        '200':
          description: Prometheus text-format exposition.
          content:
            text/plain:
              schema:
                type: string

  /openapi.yaml:
    get:
      operationId: getOpenApiSpec
      summary: This file, served as static content
      description: Plain GET/file-read route serving this hand-authored spec (Decision D19 sub-part 9) -- not runtime-generated.
      tags: [Infra]
      security: []
      responses:
        '200':
          description: This OpenAPI document.
          content:
            application/yaml:
              schema:
                type: string

  /documentation:
    get:
      operationId: getDocumentationPage
      summary: Swagger UI
      description: Minimal hand-rolled HTML page loading Swagger UI from a CDN, pointed at /openapi.yaml (Decision D19 sub-part 9).
      tags: [Infra]
      security: []
      responses:
        '200':
          description: HTML page.
          content:
            text/html:
              schema:
                type: string

  /stream:
    get:
      operationId: streamConnect
      summary: WebSocket upgrade -- live ticks and CIO verdicts
      description: |-
        Not a real HTTP GET -- OpenAPI 3.0 has no native WebSocket
        representation, so this entry documents the upgrade contract in
        prose (Decision D19 sub-part 5). Connect with a WebSocket client to
        ws://<host>/stream.

        A new, independently-written TickStreamServer-style layer (mirrors
        services/market-data's own streaming layer rather than importing it)
        broadcasts every message it receives from two Redis pub/sub channels
        (packages/event-bus/src/channels.ts), each message tagged by a type
        field so a single socket carries both kinds:

        - MARKET_TICKS_CHANNEL ('market.ticks') -- every normalized live
          tick published by services/market-data. Tagged type: "market.tick".
        - CIO_VERDICTS_CHANNEL ('cio.verdicts') -- every verdict computed by
          this gateway's own POST /v1/cio/verdict route, published
          immediately after computing it. Tagged type: "cio.verdict". CIO
          verdicts were never published anywhere before Sprint 9.

        Authentication for the upgrade handshake and any topic-subscription
        filtering are implementation details of task 9.3/9.13, not fixed by
        this spec.
      tags: [Infra]
      security: []
      responses:
        '101':
          description: Switching Protocols -- connection upgraded to WebSocket.

  /v1/auth/signup:
    post:
      operationId: authSignup
      summary: Create a new account and issue an access/refresh token pair
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '409':
          description: Email already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (Redis-backed, global to services/auth).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/login:
    post:
      operationId: authLogin
      summary: Authenticate with email/password and issue tokens
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (Redis-backed, global to services/auth).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/refresh:
    post:
      operationId: authRefresh
      summary: Exchange a refresh token for a new access/refresh pair
      description: Rotates the session -- the presented refresh token is revoked in the same call that issues its replacement, so it is single-use.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Refresh token invalid, expired, revoked, or session mismatch.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (Redis-backed, global to services/auth).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/logout:
    post:
      operationId: authLogout
      summary: Revoke the session behind a refresh token
      description: Idempotent -- an already-revoked, expired, or unrecognized-but-validly-signed token still returns 204. Only a bad signature is rejected.
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204':
          description: Session revoked (or already invalid -- idempotent).
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Refresh token has a bad signature.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (Redis-backed, global to services/auth).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/me:
    get:
      operationId: authMe
      summary: Current authenticated user
      tags: [Auth]
      responses:
        '200':
          description: The caller's own account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Authenticated user no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (Redis-backed, global to services/auth).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/auth/admin/ping:
    get:
      operationId: authAdminPing
      summary: RBAC demonstration route -- requires the admin role
      tags: [Auth]
      responses:
        '200':
          description: Caller holds the admin role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPingResponse'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (Redis-backed, global to services/auth).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/market-data/health:
    get:
      operationId: marketDataHealth
      summary: Market-data service liveness
      description: |-
        This service's HTTP surface is deliberately minimal -- its real
        interface is an internal WebSocket layer (TickStreamServer) plus
        ingestion/import jobs running in-process. This /health route exists
        only so orchestration (docker-compose, k8s probes) has something to
        poll. Unrelated to the gateway's own /stream, which is an
        independent WS layer (see /stream above).
      tags: [Market Data]
      security: []
      responses:
        '200':
          description: Service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                required: [status]

  /v1/education/categories:
    get:
      operationId: educationListCategories
      summary: List all content categories
      tags: [Education]
      security: []
      responses:
        '200':
          description: All categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Category'

    post:
      operationId: educationCreateCategory
      summary: Create a content category
      description: Admin only (Cipher's charter rule 2 -- content authoring is an admin action).
      tags: [Education]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryInput'
      responses:
        '201':
          description: Category created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slug already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/education/tags:
    get:
      operationId: educationListTags
      summary: List all content tags
      tags: [Education]
      security: []
      responses:
        '200':
          description: All tags.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Tag'

    post:
      operationId: educationCreateTag
      summary: Create a content tag
      description: Admin only.
      tags: [Education]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagInput'
      responses:
        '201':
          description: Tag created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slug already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/education/glossary:
    get:
      operationId: educationListGlossaryTerms
      summary: List glossary terms
      tags: [Education]
      security: []
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EducationContentStatus'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching glossary terms.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GlossaryTerm'
        '400':
          description: Invalid filter query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'

    post:
      operationId: educationCreateGlossaryTerm
      summary: Create a glossary term
      description: Admin only. createdBy is taken from the caller's JWT, never the body.
      tags: [Education]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGlossaryTermInput'
      responses:
        '201':
          description: Glossary term created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryTerm'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slug already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/education/glossary/{slug}:
    get:
      operationId: educationGetGlossaryTerm
      summary: Get a glossary term by slug
      tags: [Education]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The glossary term.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryTerm'
        '404':
          description: No glossary term with this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      operationId: educationUpdateGlossaryTerm
      summary: Update a glossary term
      description: Admin only. Slug is immutable -- omitted from the request body.
      tags: [Education]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlossaryTermInput'
      responses:
        '200':
          description: Updated glossary term.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlossaryTerm'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No glossary term with this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: educationDeleteGlossaryTerm
      summary: Delete a glossary term
      description: Admin only. Idempotent -- no existence check before delete.
      tags: [Education]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/education/courses:
    get:
      operationId: educationListCourses
      summary: List courses
      tags: [Education]
      security: []
      parameters:
        - name: categoryId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EducationContentStatus'
        - name: difficulty
          in: query
          schema:
            $ref: '#/components/schemas/EducationDifficulty'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching courses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Course'
        '400':
          description: Invalid filter query.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'

    post:
      operationId: educationCreateCourse
      summary: Create a course
      description: Admin only. createdBy is taken from the caller's JWT, never the body.
      tags: [Education]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseInput'
      responses:
        '201':
          description: Course created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Slug already in use.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/education/courses/{slug}:
    get:
      operationId: educationGetCourse
      summary: Get a course by slug
      tags: [Education]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '404':
          description: No course with this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    patch:
      operationId: educationUpdateCourse
      summary: Update a course
      description: Admin only. Slug is immutable -- omitted from the request body.
      tags: [Education]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseInput'
      responses:
        '200':
          description: Updated course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
        '400':
          description: Validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationFailure'
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No course with this slug.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      operationId: educationDeleteCourse
      summary: Delete a course
      description: Admin only. Idempotent -- no existence check before delete. Cascades to the course's lessons at the database level (lessons.course_id ON DELETE CASCADE).
      tags: [Education]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted.
        '401':
          description: Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Authenticated but not an admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /v1/education/courses/{courseSlug}/lessons:
    get:
      operationId: educationListLessons
      summary: List lessons in a course
      tags: [Education]
      security: []
      parameters:
        - name: courseSlug
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EducationContentStatus'
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Matching lessons, ordered by orderIndex.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Lesson'
        '400':
          description: Invalid filter query.
