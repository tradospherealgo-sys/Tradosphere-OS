version: "3.9"

# Task E (Sprint 5.5): every secret/config value below is interpolated from
# the project-root .env file -- `docker compose` auto-loads a .env sitting
# next to this file for ${VAR} interpolation, no env_file: directive needed
# for that. Secrets use the `${VAR:?message}` form (POSIX-style required-
# variable interpolation, supported natively by Compose) so `docker compose
# up`/`config` refuses to start with a clear error instead of silently
# falling back to a hardcoded value like the old `changeme` literals this
# file used to ship -- a committed default password/secret in a tracked file
# is not a secret. Copy .env.example to .env and fill in real values before
# running this; .env itself is gitignored and must never be committed.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set -- copy .env.example to .env and fill it in}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set -- copy .env.example to .env and fill it in}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set -- copy .env.example to .env and fill it in}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Must reference the same POSTGRES_USER/POSTGRES_DB as above --
      # pg_isready checks readiness for a specific role/database, not the
      # server as a whole, so a stale hardcoded value here would silently
      # healthcheck against the wrong (possibly nonexistent) role.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set -- copy .env.example to .env and fill it in} -d ${POSTGRES_DB:?POSTGRES_DB must be set -- copy .env.example to .env and fill it in}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Rebuilt from the same POSTGRES_* variables as the postgres service
      # above, not copied from .env's own DATABASE_URL -- that one points at
      # `localhost`, which inside this container means the container itself,
      # not the postgres service. `postgres` (the Compose service name) is
      # the reachable hostname on the compose network.
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER must be set -- copy .env.example to .env and fill it in}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set -- copy .env.example to .env and fill it in}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set -- copy .env.example to .env and fill it in}
      # Task D (Sprint 5.5): same localhost-vs-service-name reasoning as
      # DATABASE_URL above -- `redis` is the compose-network hostname.
      # Required by index.ts's requireEnv('REDIS_URL'); omitting this would
      # crash the container on boot by design (fail loud, never silently run
      # the auth endpoints unthrottled) rather than just leaving rate
      # limiting quietly disabled.
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set -- copy .env.example to .env and fill it in with a real secret, never the example placeholder}
      AUTH_SERVICE_PORT: 4001
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
    # `depends_on` alone only waits for the container to *start*, not for
    # Postgres to actually accept connections -- `condition: service_healthy`
    # (paired with the healthchecks above) is what makes `docker compose up`
    # reliably produce a working auth service instead of a race.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4001:4001"

  # Placeholder — remaining services are added here as each sprint stands
  # them up.
  # api:
  #   build: ./apps/api
  #   depends_on: [postgres, redis]
  #   ports: ["4000:4000"]

volumes:
  postgres_data:
